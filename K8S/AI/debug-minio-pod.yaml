apiVersion: v1
kind: Pod
metadata:
  name: minio-debug
  namespace: ai-app
  labels:
    app: minio-debug
spec:
  restartPolicy: Never
  containers:
    - name: debug-container
      image: ubuntu:22.04
      command: ["/bin/bash", "-c"]
      args:
        - |
          apt-get update -y && \
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl python3 python3-pip vim less netcat && \
          apt-get clean && \
          echo "✅ Tools installed. Starting interactive shell..." && \
          exec bash
      env:
        - name: MINIO_ENDPOINT
          value: "http://minio.minio.svc.cluster.local:9000"
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-app-secret
              key: accessKey
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-app-secret
              key: secretKey
      tty: true
      stdin: true