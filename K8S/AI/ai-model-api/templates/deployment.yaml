apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-model-api.fullname" . }}
  labels:
    app: {{ include "ai-model-api.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "ai-model-api.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "ai-model-api.name" . }}
    spec:
      containers:
        - name: ai-model-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MINIO_ENDPOINT
              value: {{ .Values.minio.endpoint | quote }}
            - name: MINIO_BUCKET
              value: {{ .Values.minio.bucket | quote }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.accessKeySecret }}
                  key: accessKey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.secretKeySecret }}
                  key: secretKey
            - name: MODEL_DIR
              value: {{ .Values.modelDir | quote }}
            - name: PYTHONUNBUFFERED
              value: {{ .Values.env.PYTHONUNBUFFERED | quote }}
            - name: PYTHONDONTWRITEBYTECODE
              value: {{ .Values.env.PYTHONDONTWRITEBYTECODE | quote }}
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}
